name: handy_store
description: Native store-verified non-consumable lifetime ownership.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.handysuite.handy_store
        pluginClass: HandyStorePlugin
      ios:
        pluginClass: HandyStorePlugin
      windows:
        pluginClass: HandyStorePluginCApi
