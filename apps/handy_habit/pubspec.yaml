name: handy_habit
description: Offline habits and ordered personal routines.
version: 1.0.0+1
publish_to: none
resolution: workspace
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  handy_habit_engine: any
  handy_ui: any
  handy_core: any
  handy_storage: any
  handy_files: any
  handy_notifications: any
  handy_monetization: any
  handy_ads: any
  handy_home_widget: any
  sqlite3: 3.5.2
  path_provider: 2.1.6
  google_sign_in: 7.2.0
  http: 1.6.0
  web: 1.1.1
  pdf: 3.13.1
  timezone: 0.11.2
  flutter_local_notifications: 22.3.3
  url_launcher: 6.3.2
  package_info_plus: 10.2.2
dev_dependencies:
  google_sign_in_platform_interface: 3.1.0
  handy_store: any
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - fonts/Nunito-OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
          weight: 400
        - asset: fonts/Nunito-Medium.ttf
          weight: 500
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
