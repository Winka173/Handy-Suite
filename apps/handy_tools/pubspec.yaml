name: handy_tools
description: Handy Tools Flutter migration pilot.
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  handy_core: any
  handy_tools_engine: any
  handy_files: any
  handy_storage: any
  handy_workflow: any
  handy_ui: any
  handy_monetization: any
  handy_scan: any
  handy_media_engine: any
dev_dependencies:
  mobile_scanner: 7.4.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSans-Bold.ttf
          weight: 700
  assets:
    - fonts/IBMPlexSans-OFL.txt
    - assets/icon.png
