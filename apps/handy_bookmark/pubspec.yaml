name: handy_bookmark
description: Handy Bookmark universal bookmark organizer.
publish_to: none
version: 1.0.0+3
resolution: workspace
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  handy_ui: any
  handy_core: any
  handy_storage: any
  handy_files: any
  handy_bookmark_engine: any
  handy_notifications: any
  handy_monetization: any
  handy_pdf: any
  handy_ocr: any
  pdf: 3.13.1
  sqlite3: 3.5.2
  path_provider: 2.1.6
  url_launcher: 6.3.2
  local_auth: 3.0.2
  html: 0.15.6
  http: 1.6.0
  # Google Drive sync (its hidden app folder; drive.appdata only).
  google_sign_in: 7.2.0
  image: 4.12.0
  web: 1.1.1
  crypto: 3.0.8
  shared_preferences: 2.5.6
  flutter_local_notifications: 22.3.3
  timezone: 0.11.2
  flutter_timezone: 5.1.1
dev_dependencies:
  handy_store: any
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: Newsreader
      fonts:
        - asset: fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: fonts/Newsreader-SemiBold.ttf
          weight: 600
  assets:
    - fonts/Newsreader-OFL.txt
    - assets/icon.png
    - assets/welcome/
