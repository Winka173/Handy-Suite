name: handy_recall_app
description: Handy Recall Flutter migration.
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  handy_ui: any
  handy_home_widget: any
  handy_core: any
  handy_files: any
  handy_storage: any
  handy_recall: any
  handy_notifications: any
  crypto: 3.0.8
  flutter_tts: 4.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  archive: 4.5.2
  sqlite3: 3.5.2
flutter:
  uses-material-design: true
  fonts:
    - family: Lexend
      fonts:
        - asset: fonts/Lexend-Regular.ttf
          weight: 400
        - asset: fonts/Lexend-Medium.ttf
          weight: 500
        - asset: fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: fonts/Lexend-Bold.ttf
          weight: 700
  assets:
    - fonts/Lexend-OFL.txt
    - assets/icon.png

