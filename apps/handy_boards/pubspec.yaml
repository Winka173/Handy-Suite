name: handy_boards
version: 1.0.0+1
publish_to: none
resolution: workspace
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  handy_boards_engine: any
  handy_ui: any
  handy_core: any
  handy_files: any
  handy_monetization: any
  handy_notifications: any
  handy_home_widget: any
  archive: 4.5.2
  file_picker: 13.3.0
  sqlite3: 3.5.2
  path_provider: 2.1.6
  web: 1.1.1
  flutter_markdown_plus: 1.0.12
  pdf: 3.13.1
  crypto: 3.0.8
  timezone: 0.11.2
  flutter_local_notifications: 22.3.3
  url_launcher: 6.3.2
dev_dependencies:
  test: 1.31.0
  handy_store: any
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - fonts/PlusJakartaSans-OFL.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: fonts/PlusJakartaSans-Bold.ttf
          weight: 700
