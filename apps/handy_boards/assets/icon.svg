<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="18 18 72 72">
  <!-- Handy Boards: three uneven columns of cards, with one cover card
       lifted and tilted mid-move. Original drawing on Android's 108-unit
       adaptive grid. This viewBox is the 72-unit launcher crop; use
       viewBox="0 0 108 108" for maskable.png. The complete mark fits the
       centred 66-unit safe circle. Android vectors mirror these paths.
       Rebuild the source renders with tool/icon/render.py, then run
       python tooling/app-icons.py boards from the repository root, then
       tool/icon/render.py --finish to restore the rounded in-app tile
       and Boards' web background colour. -->
